<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Black background -->
  <rect width="100%" height="100%" fill="#000" />
  <!-- Neon glow filter -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Simple stick figure with cyan glow -->
  <g stroke="#00ffff" stroke-width="4" fill="none" filter="url(#glow)" stroke-linecap="round">
    <!-- Head -->
    <circle cx="64" cy="30" r="12" />
    <!-- Body -->
    <line x1="64" y1="42" x2="64" y2="80" />
    <!-- Arms -->
    <line x1="44" y1="55" x2="84" y2="55" />
    <!-- Legs -->
    <line x1="64" y1="80" x2="48" y2="110" />
    <line x1="64" y1="80" x2="80" y2="110" />
  </g>
</svg>